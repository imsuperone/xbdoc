name: astrbot_plugin_xbdoc
display_name: 文档记忆助手
short_desc: 上传文档到知识库，对话时按需引用，无需向量模型。
desc: |
  文档记忆助手：上传 md / txt / pdf / docx / json 文档，对话时按需引用。

  - WebUI 上传、删除、预览，按群或私聊独立绑定
  - 四种生效模式：system 强制遵守、workspace 工作区、reference 参考、none 不注入
  - 关键词与 BM25 检索，纯内存计算，不依赖 Embedding 模型
  - 群专属提示词、屏蔽原人格、历史切断
  - 数据持久化在 data/plugin_data/astrbot_plugin_xbdoc
version: 1.2.25
author: Light
repo: https://github.com/imsuperone/xbdoc
astrbot_version: ">=4.16"
